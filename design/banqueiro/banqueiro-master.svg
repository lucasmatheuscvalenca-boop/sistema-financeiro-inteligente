  <!-- Vista padrão do arquivo-mestre: busto, expressão neutra. -->
  <use href="#busto" xlink:href="#busto"/>
  <use href="#cabeca" xlink:href="#cabeca"/>
  <use href="#rosto-neutro" xlink:href="#rosto-neutro"/>
  <use href="#oculos" xlink:href="#oculos"/>
  <use href="#nariz" xlink:href="#nariz"/>
</svg>
