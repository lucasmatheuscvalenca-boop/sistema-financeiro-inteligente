<?xml version="1.0" encoding="UTF-8"?>
<!--
  O Banqueiro — arquivo-mestre.

  Fonte única do personagem. Todas as outras versões (seis expressões, cabeça, avatar,
  meio corpo, corpo inteiro, sidebar, onboarding e assistente) são montadas a partir das
  partes nomeadas abaixo por scripts/banqueiro/gerar-banqueiro.mjs. Para mudar o personagem,
  edite só este arquivo e rode o gerador.

  Base visual: design/referencias/04-banqueiro-personagem-original-referencia.png
  (cabelo castanho-escuro curto com têmporas grisalhas, óculos redondos dourados, sem barba,
  pele em tom quente, olhos grandes, terno verde-escuro, camisa branca, gravata dourada).

  Sistema de coordenadas: largura 200. O busto ocupa y 0–200; o corpo continua até y 428.
  Paleta: pele #C9905E / sombra #B07A4C · cabelo #2A1C15 / grisalho #8C8178 ·
  terno #0F4A3A / lapela #0A3328 · camisa #F7F5EF · dourado #D4AF57 / #B8923F ·
  traço #1F1A17 · boca #5A2A2A · olho #FFFDF8.

  Regras: só olhos, sobrancelhas, boca e o gesto mudam entre as expressões. Os ícones de
  estado (lupa, lâmpada, troféu, atenção, alerta) são elementos à parte, posicionados pela
  interface, nunca desenhados sobre o personagem.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="1024" height="1024">
