    <!-- ───────────── Braços e gestos ─────────────
         Lado esquerdo da imagem = mão direita dele. Cada braço com gesto tem duas partes:
         o braço superior (vai ATRÁS do busto) e o antebraço com a mão (vai NA FRENTE).
         Assim o busto esconde a junção no ombro e as seis expressões mantêm o mesmo corpo. -->
    <g id="braco-esq-repouso">
      <path d="M25 186 C23 228 24 262 28 292" fill="none" stroke="#0A3328" stroke-width="29" stroke-linecap="round" stroke-linejoin="round"/>
