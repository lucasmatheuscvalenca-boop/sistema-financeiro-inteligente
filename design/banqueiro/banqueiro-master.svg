    <!-- ───────────── Ícones de estado (independentes; a interface decide onde ficam) ───────────── -->
    <g id="icone-lupa">
      <circle r="21" fill="#0B3A30"/>
      <circle cx="-2" cy="-2" r="6.5" fill="none" stroke="#F7F5EF" stroke-width="2.6"/>
