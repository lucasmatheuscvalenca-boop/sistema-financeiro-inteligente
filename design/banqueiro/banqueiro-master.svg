      <ellipse cx="28.5" cy="309" rx="11.5" ry="12.5" fill="#C9905E"/>
      <ellipse cx="38.5" cy="304" rx="4.2" ry="7" transform="rotate(-20 38.5 304)" fill="#B07A4C"/>
    </g>

